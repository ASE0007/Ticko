services:
  db:
    image: postgres:16-alpine
    container_name: ticko-db
    environment:
      POSTGRES_USER: tixory
      POSTGRES_PASSWORD: tixory
      POSTGRES_DB: tixoryops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tixory -d tixoryops"]
      interval: 3s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    container_name: ticko-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://tixory:tixory@db:5432/tixoryops?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-0123456789}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      MAX_ACTIVE_TICKETS: ${MAX_ACTIVE_TICKETS:-2}
      DEMO_TIME_SCALE: ${DEMO_TIME_SCALE:-1}
      DEMO_MODE: ${DEMO_MODE:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}   # set true in production; false so the demo bots are never throttled
      PROBE_STAGE_MS: ${PROBE_STAGE_MS:-2500}
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    container_name: ticko-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"   # open http://localhost:5173

volumes:
  pgdata:
